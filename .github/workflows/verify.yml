name: verify

# The gates from AGENTS.md, run on every push and PR.
#
# Two jobs, deliberately separate:
#   python  - the deterministic pytest gate (fast, catches most regressions)
#   e2e     - the Playwright suite against a real ui_server.py
#
# The e2e job never touches data/ada.sqlite3 (AGENTS.md: the live database is
# not to be used) and runs the face gate BOTH ways: bypassed for the UI specs,
# enabled inside gate.spec.ts, which starts its own second server.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    # Windows first (audit A-046): it is the product's platform, and the
    # 13 Windows-native test modules only collect there. ubuntu is the
    # compatibility run; tests/conftest.py skips exactly those modules by
    # name on non-Windows (WINDOWS_ONLY_MODULES) so the rest of the gate
    # still has to pass - and a platform-neutral module that imports a
    # Windows-only library fails there, which is the point (PRD Req. 37).
    name: pytest (not live, not slow) - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the project
        # Every extra: the deterministic gate exercises the document reader
        # (pypdf/openpyxl/python-docx) and the scraping parser (scrapling),
        # and `--extra dev` alone left 20 tests failing on ModuleNotFoundError
        # in the first green-attempt run (2026-09-05).
        run: uv sync --all-extras

      - name: Run the deterministic gate
        env:
          # Never the live database.
          ADA_DB: ${{ runner.temp }}/ci-ada.sqlite3
        # Per-test timeout (audit A-047): a hung subprocess fails one test,
        # not the whole job.
        run: uv run pytest tests/ -m "not live and not slow" -q -p no:cacheprovider --timeout=600

      - name: Secret scan (history)
        if: matrix.os == 'ubuntu-latest'
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_SUMMARY: 'true'

  e2e:
    name: Playwright (control room)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --extra dev

      - name: Install JS dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run the suite
        env:
          # playwright.config.ts spawns the server itself; point it at the venv
          # uv created rather than the Windows-style default path.
          FRIDAY_PYTHON: .venv/bin/python
          ADA_DB: ${{ runner.temp }}/ci-e2e-ada.sqlite3
          CI: '1'
        run: npx playwright test --project=chromium

      - name: Upload traces and report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            test-results/
            e2e-report/
          retention-days: 7
