[project]
name = "friday-tony-stark-demo"
version = "0.1.0"
description = "Friday — A Tony Stark-inspired MCP server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # The FastMCP actually imported by server.py is the one bundled with the
    # official MCP SDK (mcp.server.fastmcp). The separate third-party
    # `fastmcp` distribution was declared but never imported — removed in
    # Phase 0.
    "mcp",
    "httpx",
    "livekit-agents[deepgram,groq,openai,sarvam,silero,turn-detector]>=1.5.1",
    "livekit-plugins-google>=1.5.1",
    "python-dotenv",
    # Phase 1A system toolset. Each replaces a large amount of ctypes/COM
    # binding code rather than a few lines of our own.
    "psutil>=7",              # processes, memory, CPU  (BSD-3-Clause)
    "pyperclip>=1.9",         # clipboard               (BSD-3-Clause)
    "pygetwindow>=0.0.9",     # window focus            (BSD-3-Clause)
    "pycaw>=20240210; sys_platform == 'win32'",    # Core Audio volume (MIT)
    "comtypes>=1.4; sys_platform == 'win32'",      # COM for pycaw     (MIT)
    # Research toolset. Main-content extraction, so web_crawl returns the
    # article instead of the nav bar. 16 small packages and no browser of its
    # own — see docs/architecture/WEB_RESEARCH.md for why not Crawl4AI.
    "trafilatura>=2.2",       # HTML -> Markdown  (Apache-2.0)
]

[project.optional-dependencies]
# Structured web extraction. The parsing core only: Scrapling's `fetchers`
# extra pulls curl_cffi and a Playwright browser, and Friday must not have a
# second browser or a second network egress path. See
# friday/fabric_adapters/scrapling_parse.py.
web = [
    "scrapling>=0.4.15",      # BSD-3-Clause
]
# Document extraction (friday/toolsets/documents.py). Undeclared before -
# documents_extract/inspect imported these at call time and failed on a clean
# install; test_documents needs them to collect at all.
documents = [
    "pypdf>=4",               # PDF text + page count (BSD-3-Clause)
    "python-docx>=1.1",       # .docx incl. tables (MIT)
    "openpyxl>=3.1",          # .xlsx -> csv (MIT)
]
dev = [
    "pytest>=8",
    # tests/conftest.py implements pytest_asyncio_loop_factories, a
    # pytest-asyncio 1.4+ hook — undeclared in the Stage A dependency
    # cleanup even though the test suite requires it to collect at all.
    "pytest-asyncio>=1.4",
    # Per-test wall-clock ceiling (audit A-047): one hung subprocess fails
    # one test instead of holding a CI job (or a local chunk) for hours.
    "pytest-timeout>=2.3",
]

[project.scripts]
friday = "server:main"
friday_voice = "agent_friday:dev" # Points to the wrapper

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["friday", "server.py", "agent_friday.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]   # tests import `friday` and `agent_friday` from the repo root
markers = [
    "live: touches the network or launches a real browser (skip with -m 'not live')",
    "slow: waits on wall-clock time, e.g. a reminder firing (skip with -m 'not slow')",
]
